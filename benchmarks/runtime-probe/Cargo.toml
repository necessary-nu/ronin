[package]
name = "ronin-runtime-probe"
version = "0.0.0"
edition = "2021"
publish = false
autobins = false
autobenches = false

[[bin]]
name = "ronin-runtime-probe"
path = "benches/runtime_probe.rs"

[[bin]]
name = "tool_compare"
path = "benches/tool_compare.rs"

[features]
evented-runtime = ["dep:polling"]
tokio-runtime = ["dep:tokio"]

[dependencies]
polling = { version = "=3.11.0", optional = true }
tokio = { version = "=1.53.1", optional = true, features = [
    "io-util",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }

[profile.release]
lto = "fat"
