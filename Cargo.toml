[package]
name = "ronin"
version = "0.1.0"
edition = "2024"
description = "A fast Ninja-compatible build tool implemented in Rust"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/necessary-nu/ronin"
# Ronin is a binary tool, not a library anyone depends on from a registry, and
# it carries the Make frontend as a path dependency on a submodule. A registry
# crate cannot express that, and nothing wants it to: `cargo install --git`
# builds from the checkout, submodule included. The `include` list below is
# retained because it still describes what a distribution artifact would be
# made of, should one ever be built.
publish = false
include = [
    "src/**",
    "examples/**",
    "tests/**",
    "scripts/**",
    "benchmarks/**",
    "docs/spec/ronin/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[workspace]
members = ["kati"]
resolver = "3"

[lib]
path = "src/lib.rs"

[features]
default = ["make"]
# The Make front end: Ronin's fork of kati, evaluating a Makefile into a graph.
# On by default so the installed binary can run in Make mode, and separable so
# that using Ronin as a Ninja library does not compile a Make evaluator.
make = ["dep:kati"]

[dependencies]
bstr = { version = "1", default-features = false, features = ["std"] }
jobserver = "0.1.35"
smallvec = { version = "1.15.2", features = ["union"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# The fork is Unix-only, so the feature is too: enabling it on another target
# selects a Ninja-only build rather than failing to compile one.
#
# No `default-features = false` here, because the fork has no default features
# to decline: its jemalloc allocator sits behind an off-by-default `jemalloc`
# feature that only its own `rkati` binary asks for, so nothing on this side
# has to remember to opt out of a C build it never wanted.
kati = { path = "kati", version = "0.1.0", optional = true }
# The shell Ronin runs commands under, rather than the one the machine
# happens to have. A git dependency because nsh is upstream with its own plan
# discipline — a fix there arrives here as a lock bump, not as a commit from
# this repository.
#
# NO `rev` HERE, DELIBERATELY, and it is a standing rule rather than an
# oversight: the manifest names a branch and nothing narrower, so
# `cargo update` is the whole of taking a fix. `Cargo.lock` still records the
# resolved rev, which is what makes a build reproducible and is the right place
# for it — a rev in the manifest would make every upstream fix a manifest edit
# and a review, which is exactly the friction that let a proc-macro sit in this
# closure for four days.
#
# The branch is `master`, which is what the repository actually calls it:
# `git ls-remote --symref` answers `ref: refs/heads/master HEAD`, and there is
# no `main`. Spelled out rather than left implicit so that the day it is
# renamed, the build says so instead of quietly following.
#
# It cannot be a registry dependency, which was checked rather than assumed:
# `nsh` on crates.io is github.com/nuta/nsh, an unrelated shell last published
# in 2021, and `nsh-platform` is not published there at all. The git source is
# what the lock records, so nothing can fall back to the other project.
#
# Not behind the `make` feature: a Ninja-only build wants its own shell too.
# Unix-only because Windows has no shell in this position at all — Ninja hands
# the whole command line to `CreateProcess` — so there is nothing there to
# stand in for. See `plan/decisions/builtin-shell.md`.
nsh = { git = "https://github.com/necessary-nu/nsh", branch = "master" }
# The host-process half of the shell: it keeps a non-UTF-8 argument intact
# where `std::env::args` would panic, and undoes the three things Rust's
# runtime does before `main` that dash does not.
nsh-platform = { git = "https://github.com/necessary-nu/nsh", branch = "master" }
polling = "3.11.0"
rustix = { version = "1.1.4", features = ["fs", "process", "termios"] }
signal-hook = { version = "0.3.18", default-features = false }

[profile.release]
codegen-units = 1
lto = "fat"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# The house standard, and the ONLY statement of it: `scripts/check-lints.sh`
# runs `-D warnings` and adds no `-W` groups of its own, so what a bare
# `cargo clippy` says here is what the gate says. A command-line `-W
# clippy::nursery` would not repeat this declaration, it would override the
# allow below.
[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `pub(crate)` in a private module is the house spelling and reads as the
# intent: this crate, not the world. The lint's advice — write `pub`, since a
# private module makes them the same thing — would have every support module
# included by `#[path]` claim a visibility it does not want, and would say so
# seventeen times in examples/support/workloads.rs alone.
redundant_pub_crate = "allow"
undocumented_unsafe_blocks = "deny"
