[package]
name = "ronin"
version = "0.1.0"
edition = "2021"
description = "A fast Ninja-compatible build tool implemented in Rust"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/necessary-nu/samurai"
include = [
    "src/**",
    "examples/**",
    "tests/**",
    "scripts/**",
    "benchmarks/**",
    "docs/spec/ronin/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[lib]
path = "src/lib.rs"

[dependencies]
bstr = { version = "1", default-features = false, features = ["std"] }
jobserver = "0.1.35"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
polling = "3.11.0"
rustix = { version = "1.1.4", features = ["process"] }
signal-hook = { version = "0.3.18", default-features = false }

[profile.release]
codegen-units = 1
lto = "fat"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
undocumented_unsafe_blocks = "deny"
