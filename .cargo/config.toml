# Link the C runtime statically on Linux.
#
# Ronin is invoked once per build and often has nothing to do: on an up-to-date
# tree the whole run is a few milliseconds, so what the dynamic loader does
# before `main` is a measurable fraction of it. Resolving libc and the unwinder
# libgcc costs about 0.4 ms per invocation here, against 1.37 ms for a no-op
# build. Statically linked that no-op runs in 0.98 ms against C samurai's 0.96,
# and the dependency-log fixture goes from 3.18 ms to 2.58 against samurai's
# 2.62 — behind to ahead, on a workload whose deficit was startup and nothing
# else.
#
# This is only safe alongside `directory_to_impose` in src/subprocess.rs. A
# `Command` carrying a `cwd` makes Rust's standard library reach for
# `posix_spawn_file_actions_addchdir_np`, a weak symbol the static link does
# not supply, and without it every spawn falls back from `posix_spawn` to
# `fork` — measured at 65% slower on the scheduler fixture, which is the wrong
# trade for a tool that exists to spawn compilers. Not imposing a directory
# children are already in keeps the fast path, and with it static and dynamic
# spawn identically: 320.7 ms against 321.3 over 1,024 jobs. Do not remove one
# of these two without re-measuring the other.
#
# The cost is a binary roughly 70% larger. Peak RSS goes *down*, and for a
# developer tool run thousands of times a day the trade is the right way round.
# Nothing here resolves names or users, so none of static glibc's NSS caveats
# apply — the binary contains no `getaddrinfo`, `getpwnam` or `gethostby*`.
# Scoped to Linux because macOS does not support a statically linked libSystem.
#
# Note this lives outside the published crate: `cargo install ronin` builds
# without it and gets the dynamic startup cost back.
#
# WHAT THIS COSTS THE DEPENDENCY LIST, because it is the one standing constraint
# on the tree and nothing else states it: with target and host the same triple
# this cfg matches every unit, including a proc-macro — which must be a dylib,
# and which a statically linked target cannot produce. So there may be NO
# proc-macro anywhere in the closure, in normal, build or dev dependencies;
# `cargo test --workspace --all-targets` builds every member's dev
# dependencies, so dev is not a safe harbour. A breach reads "cannot produce
# proc-macro for <crate> as the target <triple> does not support these crate
# types".
#
# There is an escape hatch — `[build] target = "<host triple>"`, which makes
# cargo separate host tooling from the target's flags — and it was taken for
# four days when the shell reached a line editor that reached postcard that
# required serde's derive. It cost every artifact its path: the whole tree moved
# under `target/<triple>/`, six gate scripts had to compute a profile directory
# instead of naming one, and an in-repo build on another host needed its own
# `--target`. nsh made the line editor optional (upstream d07dd1e), the closure
# went clean, and the hatch came back out. Prefer declining the dependency to
# opening it again.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
rustflags = ["-C", "target-feature=+crt-static"]

# Fetch git dependencies with the `git` program rather than cargo's own client.
#
# The shell arrives as a git dependency, and a checkout whose gitconfig rewrites
# `https://github.com/` to `git@github.com:` — a common arrangement for anyone
# who pushes to these repositories — hands cargo's built-in client an SSH URL it
# cannot authenticate from a non-interactive session. The `git` program can, and
# on a host with no rewrite this changes nothing: the same HTTPS URL is fetched
# anonymously either way.
[net]
git-fetch-with-cli = true
